<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>여의도 3D 모델</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>body{margin:0;font-family:sans-serif;background:#111;color:#eee}h1{margin:12px 16px;font-size:20px}
.hint{margin:0 16px 8px;font-size:14px;color:#bbb}model-viewer{width:100%;height:75vh;background:#cfd8e3}
.bar{position:absolute;left:0;top:0;height:4px;background:#2a7de1;width:0;transition:width .2s}
.wrap{position:relative}.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#333;font-size:16px;pointer-events:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;padding:16px}.gal img{width:100%;border-radius:6px}</style></head><body>
<h1>여의도 3D 모델</h1>
<p class="hint">드래그: 회전 · 휠/핀치: 확대 · 우클릭/두 손가락: 이동</p>
<div class="wrap"><model-viewer id="mv" src="yeouido.glb" alt="여의도 3D 모델" camera-controls touch-action="pan-y"
 camera-orbit="-30deg 55deg auto" field-of-view="35deg" min-camera-orbit="auto 5deg auto" max-camera-orbit="auto 88deg auto"
 shadow-intensity="0.6" exposure="1" environment-image="neutral" interaction-prompt="none">
<div class="bar" slot="progress-bar" id="bar"></div></model-viewer><div class="load" id="ld">불러오는 중… 0%</div></div>
<h1>렌더 이미지</h1><div class="gal">
<a href="renders/63building_v8.jpg"><img src="renders/63building_v8.jpg" loading="lazy"></a>
<a href="renders/aerial_v8.jpg"><img src="renders/aerial_v8.jpg" loading="lazy"></a>
<a href="renders/assembly_v8.jpg"><img src="renders/assembly_v8.jpg" loading="lazy"></a>
<a href="renders/night_v8.jpg"><img src="renders/night_v8.jpg" loading="lazy"></a>
<a href="renders/parc1_v8.jpg"><img src="renders/parc1_v8.jpg" loading="lazy"></a>
<a href="renders/railwaybridge_v7.jpg"><img src="renders/railwaybridge_v7.jpg" loading="lazy"></a>
<a href="renders/skyline_v7.jpg"><img src="renders/skyline_v7.jpg" loading="lazy"></a>
<a href="renders/street_v7.jpg"><img src="renders/street_v7.jpg" loading="lazy"></a>
</div><script>const mv=document.getElementById('mv'),b=document.getElementById('bar'),l=document.getElementById('ld');
mv.addEventListener('progress',e=>{const p=Math.round(e.detail.totalProgress*100);b.style.width=p+'%';l.textContent='불러오는 중… '+p+'%';if(p>=100){b.style.display='none';l.style.display='none'}});</script></body></html>
