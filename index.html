<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여의도 3D 모델</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fbfe0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
model-viewer{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:linear-gradient(#7fa9d8,#dfe8f0);--progress-bar-height:0}
.top{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
 background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));color:#fff;pointer-events:none;z-index:5}
.top h1{margin:0;font-size:17px}.top .hint{font-size:12px;opacity:.85}
.btn{pointer-events:auto;margin-left:auto;border:0;border-radius:16px;padding:6px 12px;background:rgba(255,255,255,.9);font-size:13px;cursor:pointer}
.bar{position:fixed;left:0;top:0;height:3px;background:#2a7de1;width:0;z-index:6;transition:width .2s}
.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#123;font-size:16px;pointer-events:none;z-index:4}
#gal{position:fixed;inset:0;background:rgba(10,12,16,.94);z-index:10;display:none;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(50px + env(safe-area-inset-top)) 12px 20px}
#gal.on{display:block}#gal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}#gal img{width:100%;border-radius:6px}
#gal .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px}
</style></head><body>
<model-viewer id="mv" src="yeouido.glb" alt="여의도 3D 모델" camera-controls touch-action="none" tabindex="0"
 camera-target="-150m 40m 0m" camera-orbit="-25deg 62deg 1600m" field-of-view="35deg"
 min-camera-orbit="auto 0deg 2m" max-camera-orbit="auto 180deg 12000m" min-field-of-view="8deg" max-field-of-view="60deg"
 interpolation-decay="100" environment-image="env.hdr" tone-mapping="neutral" exposure="1.05" shadow-intensity="0.8" interaction-prompt="none">
<div slot="progress-bar"></div></model-viewer>
<div class="bar" id="bar"></div><div class="load" id="ld">불러오는 중… 0%</div>
<div class="top"><h1>여의도 3D 모델</h1>
<span class="hint">드래그 회전 · 휠/핀치 확대 · 우클릭/두 손가락 이동 · 더블클릭 확대 · 방향키 이동 · +/− 확대·축소 · Shift+방향키 회전</span>
<button class="btn" id="gb">렌더 사진</button></div>
<div id="gal"><button class="btn x" id="gx">닫기 ✕</button><div class="grid"><a href="renders/63building_v8.jpg" target="_blank"><img src="renders/63building_v8.jpg" loading="lazy"></a><a href="renders/aerial_v8.jpg" target="_blank"><img src="renders/aerial_v8.jpg" loading="lazy"></a><a href="renders/assembly_v8.jpg" target="_blank"><img src="renders/assembly_v8.jpg" loading="lazy"></a><a href="renders/night_v8.jpg" target="_blank"><img src="renders/night_v8.jpg" loading="lazy"></a><a href="renders/parc1_v8.jpg" target="_blank"><img src="renders/parc1_v8.jpg" loading="lazy"></a><a href="renders/railwaybridge_v7.jpg" target="_blank"><img src="renders/railwaybridge_v7.jpg" loading="lazy"></a><a href="renders/skyline_v7.jpg" target="_blank"><img src="renders/skyline_v7.jpg" loading="lazy"></a><a href="renders/street_v7.jpg" target="_blank"><img src="renders/street_v7.jpg" loading="lazy"></a></div></div>
<script>
const mv=document.getElementById('mv'),bar=document.getElementById('bar'),ld=document.getElementById('ld');
mv.addEventListener('progress',e=>{const p=Math.round(e.detail.totalProgress*100);bar.style.width=p+'%';ld.textContent='불러오는 중… '+p+'%';if(p>=100){bar.style.display='none';ld.style.display='none'}});
const gal=document.getElementById('gal');document.getElementById('gb').onclick=()=>gal.classList.add('on');document.getElementById('gx').onclick=()=>gal.classList.remove('on');
const q=new URLSearchParams(location.search);if(q.get('orbit'))mv.cameraOrbit=q.get('orbit');if(q.get('target'))mv.cameraTarget=q.get('target');if(q.get('fov'))mv.fieldOfView=q.get('fov');
mv.addEventListener('dblclick',e=>{const h=mv.positionAndNormalFromPoint(e.clientX,e.clientY);if(h){const p=h.position;mv.cameraTarget=p.x+'m '+p.y+'m '+p.z+'m';const o=mv.getCameraOrbit();mv.cameraOrbit=o.theta+'rad '+o.phi+'rad '+Math.max(30,o.radius*0.35)+'m';}});
const keys=new Set();
addEventListener('keydown',e=>{if(gal.classList.contains('on')){if(e.key==='Escape')gal.classList.remove('on');return;}
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown',' '].includes(e.key))e.preventDefault();
 keys.add(e.key.length===1?e.key.toLowerCase():e.key); keys.shift=e.shiftKey;},{capture:true});
addEventListener('keyup',e=>{keys.delete(e.key.length===1?e.key.toLowerCase():e.key);keys.shift=e.shiftKey;});
addEventListener('blur',()=>keys.clear());
let last=performance.now();
function tick(t){const dt=Math.min(0.1,(t-last)/1000);last=t;
 if(keys.size){const o=mv.getCameraOrbit(),tg=mv.getCameraTarget();let th=o.theta,ph=o.phi,r=o.radius;
  const up=keys.has('ArrowUp')||keys.has('w'),dn=keys.has('ArrowDown')||keys.has('s'),lf=keys.has('ArrowLeft')||keys.has('a'),rt=keys.has('ArrowRight')||keys.has('d');
  const zin=keys.has('+')||keys.has('=')||keys.has('PageUp')||keys.has('e'),zout=keys.has('-')||keys.has('_')||keys.has('PageDown')||keys.has('q');
  if(keys.shift){th+=((lf?1:0)-(rt?1:0))*1.5*dt;ph=Math.min(Math.PI-0.01,Math.max(0.01,ph+((dn?1:0)-(up?1:0))*1.0*dt));}
  else{const sp=r*0.8*dt;const f=(up?1:0)-(dn?1:0),s=(rt?1:0)-(lf?1:0);
   // camera looks toward -(sin th, cos th) in x/z
   const fx=-Math.sin(th),fz=-Math.cos(th),sx=Math.cos(th),sz=-Math.sin(th);
   tg.x+=(fx*f+sx*s)*sp;tg.z+=(fz*f+sz*s)*sp;mv.cameraTarget=tg.x+'m '+tg.y+'m '+tg.z+'m';}
  if(zin)r*=Math.pow(0.25,dt);if(zout)r*=Math.pow(4,dt);r=Math.max(2,Math.min(12000,r));
  mv.cameraOrbit=th+'rad '+ph+'rad '+r+'m';mv.jumpCameraToGoal();}
 requestAnimationFrame(tick);}
requestAnimationFrame(tick);
</script></body></html>
