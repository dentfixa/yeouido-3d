<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여의도 3D 모델</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fbfe0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
model-viewer{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:linear-gradient(#7fa9d8,#dfe8f0);--progress-bar-height:0}
.top{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
 background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));color:#fff;pointer-events:none;z-index:5}
.top h1{margin:0;font-size:17px}.top .hint{font-size:12px;opacity:.85}
.btn{pointer-events:auto;margin-left:auto;border:0;border-radius:16px;padding:6px 12px;background:rgba(255,255,255,.9);font-size:13px;cursor:pointer}
.bar{position:fixed;left:0;top:0;height:3px;background:#2a7de1;width:0;z-index:6;transition:width .2s}
.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#123;font-size:16px;pointer-events:none;z-index:4}
#gal{position:fixed;inset:0;background:rgba(10,12,16,.94);z-index:10;display:none;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(50px + env(safe-area-inset-top)) 12px 20px}
#gal.on{display:block}#gal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}#gal img{width:100%;border-radius:6px}
#gal .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px}
#vid{position:fixed;inset:0;background:rgba(10,12,16,.96);z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(50px + env(safe-area-inset-top)) 12px 20px}
#vid.on{display:flex}#vid video{max-width:100%;max-height:85vh;border-radius:6px;background:#000}#vid .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px}#vid .dl{color:#9cf;font-size:13px}
</style></head><body>
<model-viewer id="mv" src="yeouido.glb" alt="여의도 3D 모델" camera-controls touch-action="none" tabindex="0"
 camera-target="-150m 40m 0m" camera-orbit="-25deg 62deg 1600m" field-of-view="35deg"
 min-camera-orbit="auto 0deg 2m" max-camera-orbit="auto 160deg 12000m" min-field-of-view="8deg" max-field-of-view="60deg"
 interpolation-decay="100" zoom-sensitivity="0.25" environment-image="env.hdr" tone-mapping="neutral" exposure="1.05" shadow-intensity="0.8" interaction-prompt="none">
<div slot="progress-bar"></div></model-viewer>
<div class="bar" id="bar"></div><div class="load" id="ld">불러오는 중… 0%</div>
<div class="top"><h1>여의도 3D 모델</h1>
<span class="hint">WASD: 이동 · 방향키: 시점 · +/−: 확대·축소 · Shift: 빠르게 · 드래그 회전 · 휠/핀치 확대 · 우클릭/두 손가락 이동</span>
<button class="btn" id="vb">비행 영상</button><button class="btn" id="gb" style="margin-left:0">렌더 사진</button></div>
<div id="vid"><button class="btn x" id="vx">닫기 ✕</button><video id="fv" src="video/yeouido_flythrough_v8.mp4" poster="video/flythrough_poster.jpg" controls playsinline preload="none"></video><a class="dl" href="video/yeouido_flythrough_v8.mp4" target="_blank">영상 새 창에서 열기 (MP4, 1920×1080, 30초)</a></div>
<div id="gal"><button class="btn x" id="gx">닫기 ✕</button><div class="grid"><a href="renders/63building_v8.jpg" target="_blank"><img src="renders/63building_v8.jpg" loading="lazy"></a><a href="renders/aerial_v8.jpg" target="_blank"><img src="renders/aerial_v8.jpg" loading="lazy"></a><a href="renders/assembly_v8.jpg" target="_blank"><img src="renders/assembly_v8.jpg" loading="lazy"></a><a href="renders/night_v8.jpg" target="_blank"><img src="renders/night_v8.jpg" loading="lazy"></a><a href="renders/parc1_v8.jpg" target="_blank"><img src="renders/parc1_v8.jpg" loading="lazy"></a><a href="renders/railwaybridge_v7.jpg" target="_blank"><img src="renders/railwaybridge_v7.jpg" loading="lazy"></a><a href="renders/skyline_v7.jpg" target="_blank"><img src="renders/skyline_v7.jpg" loading="lazy"></a><a href="renders/street_v7.jpg" target="_blank"><img src="renders/street_v7.jpg" loading="lazy"></a></div></div>
<script>
const mv=document.getElementById('mv'),bar=document.getElementById('bar'),ld=document.getElementById('ld');
mv.addEventListener('progress',e=>{const p=Math.round(e.detail.totalProgress*100);bar.style.width=p+'%';ld.textContent='불러오는 중… '+p+'%';if(p>=100){bar.style.display='none';ld.style.display='none'}});
const gal=document.getElementById('gal'),vid=document.getElementById('vid'),fv=document.getElementById('fv');document.getElementById('vb').onclick=()=>{vid.classList.add('on');fv.play().catch(()=>{})};document.getElementById('vx').onclick=()=>{fv.pause();vid.classList.remove('on')};if(location.hash==='#video')vid.classList.add('on');document.getElementById('gb').onclick=()=>gal.classList.add('on');document.getElementById('gx').onclick=()=>gal.classList.remove('on');
const q=new URLSearchParams(location.search);if(q.get('orbit'))mv.cameraOrbit=q.get('orbit');if(q.get('target'))mv.cameraTarget=q.get('target');if(q.get('fov'))mv.fieldOfView=q.get('fov');
mv.addEventListener('dblclick',e=>{const h=mv.positionAndNormalFromPoint(e.clientX,e.clientY);if(h){const p=h.position;mv.cameraTarget=p.x+'m '+p.y+'m '+p.z+'m';const o=mv.getCameraOrbit();mv.cameraOrbit=o.theta+'rad '+o.phi+'rad '+Math.max(30,o.radius*0.35)+'m';}});
const keys=new Set();
const nm=c=>c.startsWith('Key')?c.slice(3).toLowerCase():({Equal:'+',NumpadAdd:'+',Minus:'-',NumpadSubtract:'-'})[c]||c;
let shiftDown=false;
addEventListener('keydown',e=>{if(vid.classList.contains('on')){if(e.code==='Escape'){fv.pause();vid.classList.remove('on');}return;}if(gal.classList.contains('on')){if(e.code==='Escape')gal.classList.remove('on');return;}
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Space'].includes(e.code))e.preventDefault();
 if(e.code==='ShiftLeft'||e.code==='ShiftRight')shiftDown=true; else keys.add(nm(e.code)); keys.shift=shiftDown||e.shiftKey;},{capture:true});
addEventListener('keyup',e=>{if(e.code==='ShiftLeft'||e.code==='ShiftRight')shiftDown=false; else keys.delete(nm(e.code)); keys.shift=shiftDown;},{capture:true});
addEventListener('blur',()=>{keys.clear();shiftDown=false;keys.shift=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();shiftDown=false;keys.shift=false;}});
let last=performance.now();
function tick(t){const dt=Math.min(0.1,(t-last)/1000);last=t;
 if(keys.size){const o=mv.getCameraOrbit(),tg=mv.getCameraTarget();let th=o.theta,ph=o.phi,r=o.radius;const k=x=>keys.has(x),boost=keys.shift?3:1;
  const f=(k('w')?1:0)-(k('s')?1:0),s=(k('d')?1:0)-(k('a')?1:0);
  if(f||s){const n=Math.hypot(f,s),sp=r*0.0444*dt*boost/n;const fx=-Math.sin(th),fz=-Math.cos(th),sx=Math.cos(th),sz=-Math.sin(th);
   tg.x+=(fx*f+sx*s)*sp;tg.z+=(fz*f+sz*s)*sp;mv.cameraTarget=tg.x+'m '+tg.y+'m '+tg.z+'m';}
  const yaw=((k('ArrowLeft')?1:0)-(k('ArrowRight')?1:0))*0.1*dt*boost, pit=((k('ArrowUp')?1:0)-(k('ArrowDown')?1:0))*0.0667*dt*boost;
  if(yaw||pit){const cx=tg.x+r*Math.sin(th)*Math.sin(ph),cy=tg.y+r*Math.cos(ph),cz=tg.z+r*Math.cos(th)*Math.sin(ph);
   th+=yaw; ph=Math.min(2.79,Math.max(0.05,ph+pit));
   if(Math.cos(ph)>0) r=Math.min(r,Math.max(2,(cy-1)/Math.cos(ph)));
   tg.x=cx-r*Math.sin(th)*Math.sin(ph); tg.y=cy-r*Math.cos(ph); tg.z=cz-r*Math.cos(th)*Math.sin(ph);
   mv.cameraTarget=tg.x+'m '+tg.y+'m '+tg.z+'m';}
  const zin=k('+')||k('=')||k('PageUp')||k('e'),zout=k('-')||k('_')||k('PageDown')||k('q');
  if(zin)r*=Math.pow(Math.pow(0.5,boost/9),dt);if(zout)r*=Math.pow(Math.pow(2,boost/9),dt);r=Math.max(2,Math.min(12000,r));
  mv.cameraOrbit=th+'rad '+ph+'rad '+r+'m';mv.jumpCameraToGoal();}
 requestAnimationFrame(tick);}
requestAnimationFrame(tick);
let fixing=false;
function guard(){if(fixing)return;const t=mv.getCameraTarget(),o=mv.getCameraOrbit();let ch=false;
 if(t.y<1){t.y=1;ch=true;}
 const h=t.y+o.radius*Math.cos(o.phi);
 if(h<2){t.y+=2-h;ch=true;}
 if(ch){fixing=true;mv.cameraTarget=t.x+'m '+t.y+'m '+t.z+'m';mv.jumpCameraToGoal();fixing=false;}}
mv.addEventListener('camera-change',guard);
</script></body></html>
